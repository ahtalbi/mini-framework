<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=19293&format=png&color=000000"
        type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #todo_container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            justify-content: center;
            border: 1px solid black;
            padding: 20px;
            width: clamp(20vw, 40vw, 60vw);
        }

        #todo_form {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #todos {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #todo_form input {
            width: 90%;
            padding: 5px;
        }

        #todo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border: 1px dashed rgba(0, 0, 0, 0.212);
            width: 90%;

        }

        #todo input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>
    <h1>Todos</h1>
    <div id="todo_container">
        <form id="todo_form">
            <input type="text" placeholder="Create your todo here ...">
        </form>

        {
            "form": {
                "neighbours": {
                    "input": "neighbours": null,
                    "attrs": {"type":"text", "placeholder":"Create your todo here ..."}
                },
                "attrs": {"id": "todo_form"}
            }
        }

        <div id="todos">
            <div id="todo">
                <input type="checkbox" name="" id="">
                <h2>todo n1</h2><button>X</button>
            </div>
        </div>
    </div>
    <script src="server.js"></script>
</body>

</html>
